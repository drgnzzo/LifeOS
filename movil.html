<!-- ══════════════════════════════════════════════════════════════════
     LifeOS — movil.html  v1.0
     Versión mínima para el celular: capturar rápido y consultar de un
     vistazo. Nada más.

     QUÉ CARGA Y QUÉ NO
     Solo tres archivos: raw-core.js (API_URL, objeto api, _DIAL_ITEMS),
     raw-auth.js (puerta TOTP) y raw-sims.js (las barras). Fuera quedan
     raw-overlay.js (500 KB), three.js (600 KB), GSAP y raw-app.css
     (143 KB). De ~1.6 MB a ~230 KB, y comprimido bastante menos.

     EL MENÚ SE GENERA SOLO
     Las capturas no están escritas a mano aquí: salen de _DIAL_ITEMS,
     el mismo registro que dibuja el dial del escritorio. Si agregas un
     gajo allá, aparece aquí sin tocar este archivo. Para saber a qué
     formulario va cada sub se ejecuta su propio preset() y se lee el
     window._dialPreset que deja — otra vez, la misma fuente de verdad.

     LOS FORMULARIOS SÍ SON PROPIOS
     Los del escritorio viven dentro de raw-overlay.js, que es justo lo
     que no queremos bajar al celular. Así que aquí hay un motor
     genérico con una tabla de campos (FORMS). Lo que todavía no tenga
     ficha se lista igual y lo dice claramente, en vez de fingir que
     funciona. Se van agregando de a poco.

     CONSULTAR
     Una sola llamada a getAll() trae todo (viene cacheada en el
     backend) y de paso abre la compuerta de los endpoints diferidos de
     raw-core. Con eso se pintan las barras y se responden las
     preguntas, sin más viajes a la red.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#05070c; --sup:#0d1119; --bor:#1e2634; --tx:#e8edf5;
  --dim:#7d8ba0; --faint:#4d5a6f; --acc:#8b5cf6;
  --ok:#4ADE80; --warn:#FBBF24; --err:#EF4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 24px);font-size:15px}
header{position:sticky;top:0;z-index:10;background:rgba(5,7,12,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--bor);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px}
.marca{font-size:13px;font-weight:800;letter-spacing:.18em;flex:1}
.marca b{color:var(--acc)}
.score{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:10px;color:var(--dim);font-weight:600;display:block;letter-spacing:.1em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icobtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);font-size:16px;display:flex;align-items:center;
  justify-content:center;transition:transform .16s,background .16s}
.icobtn:active{transform:scale(.92);background:rgba(255,255,255,.09)}
main{padding:16px;max-width:640px;margin:0 auto}
h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin:26px 0 10px;font-weight:800}
h2:first-child{margin-top:6px}

/* ── Barras ── */
.barras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* v1.1 — Menos caja: esquinas mas suaves, borde mas tenue, un degradado
   apenas perceptible que le quita el aire de tabla, y entrada escalonada
   para que la pantalla no aparezca de golpe. */
.b{border-radius:16px;padding:11px 12px;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.07);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s;
  animation:aparece .4s both}
.b:nth-child(2){animation-delay:.03s} .b:nth-child(3){animation-delay:.06s}
.b:nth-child(4){animation-delay:.09s} .b:nth-child(5){animation-delay:.12s}
.b:nth-child(6){animation-delay:.15s} .b:nth-child(7){animation-delay:.18s}
.b:nth-child(8){animation-delay:.21s} .b:nth-child(9){animation-delay:.24s}
.b:nth-child(10){animation-delay:.27s}
.b:active{transform:scale(.97)}
@keyframes aparece{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.b-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.b-ico{font-size:14px;line-height:1}
.b-l{flex:1;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-v{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.b-bar{height:6px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
/* La barra crece con rebote suave, no con un salto seco. */
.b-bar>i{display:block;height:100%;border-radius:999px;
  transition:width .85s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 0 10px currentColor}

/* ── Preguntar ── */
.preg{display:flex;gap:8px}
.preg input{flex:1;min-width:0;padding:14px 16px;font-size:15px;color:var(--tx);
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:999px;outline:none;transition:border-color .18s,background .18s}
.preg input:focus{border-color:var(--acc)}
.rta{margin-top:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.07);
  border-left:3px solid var(--acc);border-radius:14px;font-size:14px;line-height:1.55;
  white-space:pre-line;animation:aparece .3s both;
  background:linear-gradient(160deg,rgba(139,92,246,.09),rgba(255,255,255,.015))}
.sug{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sug button{font-size:12px;padding:8px 13px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:var(--dim);
  transition:transform .16s,color .16s,border-color .16s}
.sug button:active{transform:scale(.94);color:var(--tx)}

/* ── Capturar ── */
.gajos{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
/* v1.1 — Antes: caja con una linea dura arriba. Ahora pastilla con el
   acento como punto y halo, que pesa menos y se lee igual de rapido. */
.gajo{border-radius:999px;padding:13px 10px;text-align:center;font-size:11px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),color .18s,border-color .18s,background .18s}
.gajo::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:7px;vertical-align:1px;background:var(--gc,var(--acc));
  box-shadow:0 0 7px var(--gc,var(--acc))}
.gajo:active{transform:scale(.95)}
.gajo.on{color:var(--tx);background:rgba(255,255,255,.09);
  border-color:var(--gc,var(--acc));box-shadow:0 0 0 1px var(--gc,var(--acc)) inset}

/* Subs desplegados en linea, justo bajo el menu. */
#subs-inline{max-height:0;overflow:hidden;opacity:0;
  transition:max-height .3s ease,opacity .25s ease,margin .3s ease}
#subs-inline.on{max-height:620px;opacity:1;margin-top:11px}
.subs{display:flex;flex-direction:column;gap:7px}
.sub{display:flex;align-items:center;gap:11px;padding:14px 15px;border-radius:14px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.07);text-align:left;width:100%;font-size:15px;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s}
.sub:active{transform:scale(.985);border-color:rgba(255,255,255,.18)}
.sub .pt{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sub .na{margin-left:auto;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

/* ── Hoja de formulario ── */
#hoja{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;
  overflow-y:auto;padding:0 0 40px}
#hoja.on{display:block}
.hoja-top{position:sticky;top:0;background:rgba(5,7,12,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bor);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
  display:flex;align-items:center;gap:12px}
.hoja-top .t{flex:1;font-size:15px;font-weight:700}
.campo{margin:0 16px 14px}
.campo label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:800;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;padding:14px 15px;font-size:16px;
  color:var(--tx);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;outline:none;transition:border-color .18s,background .18s}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--acc)}
.campo textarea{min-height:88px;resize:vertical}
.rapidos{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.rapidos button{font-size:13px;padding:10px 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);
  transition:transform .16s,background .16s,border-color .16s}
.rapidos button:active{transform:scale(.94)}
.rapidos button.on{border-color:var(--acc);background:rgba(139,92,246,.16);color:var(--tx)}
.guardar{margin:22px 16px 0;width:calc(100% - 32px);padding:17px;font-size:16px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,#7c3aed,#a78bfa);border-radius:16px;
  box-shadow:0 8px 22px rgba(124,58,237,.32);transition:transform .16s,box-shadow .16s}
.guardar:active{transform:scale(.98);box-shadow:0 4px 12px rgba(124,58,237,.28)}
.guardar:disabled{opacity:.5}
.aviso{margin:14px 16px 0;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45}
.aviso.ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);color:var(--ok)}
.aviso.mal{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:var(--err)}
.vacio{color:var(--faint);font-size:14px;padding:10px 2px;line-height:1.5}
</style>

<header>
  <div class="marca">LIFE<b>OS</b></div>
  <div class="score" id="score">—<small>SCORE</small></div>
  <button class="icobtn" id="recargar" title="Recargar">↻</button>
  <a class="icobtn" href="index.html?full=1" title="Versión de escritorio" style="text-decoration:none">⤢</a>
</header>

<main>
  <h2>Cómo voy</h2>
  <div class="barras" id="barras"><div class="vacio">Cargando…</div></div>

  <h2>Preguntar</h2>
  <div class="preg">
    <input id="q" placeholder="¿cuánta agua llevo?" autocomplete="off" enterkeyhint="send">
    <button class="icobtn" id="qgo">→</button>
  </div>
  <div id="rta"></div>
  <div class="sug" id="sug"></div>

  <h2>Capturar</h2>
  <div class="gajos" id="gajos"><div class="vacio">Cargando…</div></div>
  <div id="subs-inline"></div>
</main>

<div id="hoja"></div>
<!-- raw-core.js registra un listener de Escape que busca este elemento -->
<div id="popup-concepto" style="display:none"></div>

<script src="raw-core.js?v=9230"></script>
<script src="raw-auth.js?v=9220"></script>
<script src="raw-sims.js?v=9190"></script>
<script src="movil.js?v=1100"></script>
